name: publish

# Publishes to npm when a version tag is pushed, using npm Trusted Publishing
# (OIDC). No npm token is stored in this repository.
#
# One-time setup, after the package exists on npmjs.com:
#   npmjs.com -> the package -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization or user: wr0ld
#     Repository:           dsh-tmon
#     Workflow filename:    publish.yml
#     Environment:          (leave empty)
# Then bump the version, commit, and `git tag vX.Y.Z && git push origin vX.Y.Z`.
#
# npm requires the package to exist before a trusted publisher can be
# configured, so the very first publish has to be done locally with 2FA.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The tag and package.json must agree, otherwise npm publishes a version
      # nobody asked for.
      - name: Check tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      # Re-pushing an existing tag, or tagging a version that is already on npm,
      # should not turn into a red run: publishing over a published version is
      # rejected by the registry.
      - name: Check whether this version is already published
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-tmon@$version" version >/dev/null 2>&1; then
            echo "dsh-tmon@$version is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
